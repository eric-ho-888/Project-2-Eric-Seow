name: EV Data Pipeline Automation

on:
  schedule:
    - cron: '*/5 * * * *'  # Trigger every 5 minutes
  workflow_dispatch:       # Enable manual trigger button in GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests duckdb

      - name: Execute Ingestion Script
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
        run: python ingest_ev_data.py

      - name: Commit and Push Updated DuckDB File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ev_pipeline.duckdb
          
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "auto: append 5-min snapshot to ev_pipeline.duckdb"
            git push
          fi